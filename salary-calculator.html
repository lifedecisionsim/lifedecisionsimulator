<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Salary Projection Calculator – See your future salary growth over the next years.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Projection Calculator</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f5f7fa; }
        input { padding: 8px; margin: 5px; width: 200px; }
        button { padding: 10px 20px; margin-top: 10px; background: #000; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #333; }
        table { margin: 20px auto; border-collapse: collapse; }
        th, td { padding: 10px 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<h1>Salary Projection Calculator</h1>

<input type="number" id="salary" placeholder="Current Salary" />
<input type="number" id="raise" placeholder="Annual Raise (%)" />
<input type="number" id="years" placeholder="Number of Years" />
<br>
<button onclick="calculateSalary()">Calculate</button>

<div id="result"></div>

<script>
function calculateSalary() {
    const salary = parseFloat(document.getElementById('salary').value);
    const raise = parseFloat(document.getElementById('raise').value) / 100;
    const years = parseInt(document.getElementById('years').value);

    if(isNaN(salary) || isNaN(raise) || isNaN(years)) {
        alert('Please fill in all fields correctly.');
        return;
    }

    let html = '<table><tr><th>Year</th><th>Salary</th></tr>';
    let currentSalary = salary;
    for(let i=1; i<=years; i++) {
        html += `<tr><td>${i}</td><td>$${currentSalary.toFixed(2)}</td></tr>`;
        currentSalary += currentSalary * raise;
    }
    html += '</table>';
    document.getElementById('result').innerHTML = html;
}
</script>

</body>
</html>
