<h1>Burnout Risk Calculator</h1>

<input type="number" id="hours" placeholder="Weekly Work Hours" />
<input type="number" id="stress" placeholder="Stress Level (1-10)" />
<input type="number" id="years" placeholder="Years in Current Role" />
<br>
<button onclick="calculateBurnout()">Check Burnout Risk</button>

<div id="result"></div>

<script>
function calculateBurnout() {
    const hours = parseFloat(document.getElementById('hours').value);
    const stress = parseFloat(document.getElementById('stress').value);
    const years = parseFloat(document.getElementById('years').value);

    if(isNaN(hours) || isNaN(stress) || isNaN(years)) {
        alert('Please fill in all fields correctly.');
        return;
    }

    // Simple formula for burnout risk
    let score = (hours / 40) * 0.4 + (stress / 10) * 0.4 + (years / 10) * 0.2;
    
    let risk = '';
    let advice = '';
    
    if(score < 0.4) {
        risk = 'Low';
        advice = 'Keep up your work-life balance!';
    } else if(score < 0.7) {
        risk = 'Medium';
        advice = 'Consider short breaks and mindfulness exercises.';
    } else {
        risk = 'High';
        advice = 'Take action: reduce workload, seek support, and prioritize rest.';
    }
    
    document.getElementById('result').innerHTML = `<p>Burnout Risk: <strong>${risk}</strong></p><p>${advice}</p>`;
}
</script>
